[defaults]
inventory = inventory
retry_files_enabled = false
interpreter_python = auto_silent
# uc_secret, the only way the build reads a secret: plugins/lookup/uc_secret.py.
lookup_plugins = plugins/lookup
# uc_reject records a node the build cannot secure in the client log:
# plugins/callback/uc_reject.py.
callback_plugins = plugins/callback
callbacks_enabled = uc_reject
