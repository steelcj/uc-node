#!/usr/bin/env ansible-playbook
---
- name: Check the node definition
  hosts: localhost
  gather_facts: false

  tasks:
    # Ansible loads inventory/group_vars/ only with this repository's
    # inventory, which ansible.cfg names when run from this directory.
    - name: Check that the repository's configuration is loaded
      ansible.builtin.assert:
        that:
          - platforms is defined
        fail_msg: "The configuration in inventory/group_vars/all/ is not loaded. Run ansible-playbook from the repository directory, so it reads ansible.cfg and uses the repository's inventory."
        quiet: true

    # inventory/group_vars/all/hostname.yml sets hostname from
    # node_hostname, so a different value can only come from a node
    # definition written before client_domain replaced hostname.
    - name: Refuse a node definition that still has hostname
      ansible.builtin.assert:
        that:
          - hostname == node_hostname
        fail_msg: "The node definition sets hostname, which is no longer used. Rename hostname to client_domain in the node definition."
        quiet: true

    # users.yml reads both hashes from the batch through uc_secret, and
    # nothing in the inventory defines these names, so a value can only
    # come from a node definition written before batches.
    - name: Refuse a node definition that still holds a password hash
      ansible.builtin.assert:
        that:
          - root_password_hash is not defined
          - initial_password_hash is not defined
        fail_msg: "The node definition holds root_password_hash or initial_password_hash, which are no longer used. Make a batch with scripts/new-batch, which writes both hashes to ~/.secrets/uc/build/batches/<batch>.yml, then remove both hashes from the node definition and name the batch in raw_node_batch. See en/docs/guides/0-set-up-a-client.md."
        quiet: true

    - name: Check platform
      ansible.builtin.assert:
        that:
          - platform in platforms
        fail_msg: "platform must be one of {{ platforms.keys() | join(', ') }}. It is {{ platform }}."
        quiet: true

    - name: Check that the required fields are present
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.vars', item, default='') | string | length > 0
        fail_msg: "The node definition has no {{ item }}, which the {{ platform }} platform requires."
        quiet: true
      loop: "{{ node_required_fields + platforms[platform].required_fields }}"

    # Nothing in the inventory sets these for localhost, so on localhost a
    # value can only come from -e, which is how the node definition is
    # passed. Ansible gives localhost ansible_host: its inventory name, so
    # that one is compared with inventory_hostname.
    - name: Refuse a node definition that sets a connection variable
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.vars', item, default='uc-node-unset') == (inventory_hostname if item == 'ansible_host' else 'uc-node-unset')
        fail_msg: "The node definition sets {{ item }}. The platform's create play sets the connection variables, so remove {{ item }} from the node definition."
        quiet: true
      loop: "{{ node_connection_variables }}"

    # These restate the rules in names.yml and incus.yml, so a value that
    # differs can only come from the node definition. Change them together.
    - name: Refuse a node definition that sets a calculated name
      ansible.builtin.assert:
        that:
          - node_fqdn == node_label ~ '.' ~ client_domain
          - node_hostname == node_label
          - incus_instance == (node_label ~ '.' ~ client_domain) | replace('.', '-')
        fail_msg: "The node definition sets node_fqdn, node_hostname or incus_instance. These are calculated from client_domain and node_label, so remove them from the node definition."
        quiet: true

    # The same rule as scripts/new-node: at least two labels, each of 1 to
    # 63 lowercase letters, digits and hyphens, not starting or ending with
    # a hyphen, and at most 253 characters in all.
    - name: Check client_domain
      ansible.builtin.assert:
        that:
          - client_domain is string
          - client_domain | length <= 253
          - client_domain is ansible.builtin.match('^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
        fail_msg: "client_domain must be DNS labels of lowercase letters, digits and hyphens, each at most 63 characters, separated by dots and at most 253 characters in all, for example example.org. It is {{ client_domain }}."
        quiet: true

    # The node definition comes from the client inventory's intake/, and
    # the candidate and any rejection are written beside it, so the build
    # needs to know which client inventory it is. scripts/build passes it.
    - name: Require the client inventory
      ansible.builtin.assert:
        that:
          - uc_client_inventory is defined
          - uc_client_inventory is string
          - uc_client_inventory is ansible.builtin.match('/')
          - (uc_client_inventory ~ '/intake') is directory
        fail_msg: "uc_client_inventory must be the absolute path of a client inventory with an intake/ directory, such as /home/operator/.private/uc/example-org/uc-inventory. Run the build with scripts/build <client inventory> <fqdn>, which passes it."
        quiet: true

    - name: Note the node definition's place in the client inventory
      ansible.builtin.set_fact:
        uc_intake_file: "{{ uc_client_inventory }}/intake/{{ node_fqdn }}.yml"

    # The node definition is passed with -e, and the client inventory with
    # another -e, so they could name different nodes. The node's own file
    # in intake/ must exist and describe the same node.
    - name: Refuse a node definition that is not in the client inventory
      ansible.builtin.assert:
        that:
          - uc_intake_file is file
          - uc_intake.client_domain | default('') == client_domain
          - uc_intake.node_label | default(node_label) == node_label
        fail_msg: "The client inventory {{ uc_client_inventory }} has no node definition for {{ node_fqdn }} in intake/, or the one there describes another node. Write it with scripts/new-node {{ uc_client_inventory }}, and build with scripts/build {{ uc_client_inventory }} {{ node_fqdn }}."
        quiet: true
      vars:
        uc_intake: "{{ (lookup('ansible.builtin.file', uc_intake_file) | from_yaml) if uc_intake_file is file else {} }}"

    # A node definition is passed with -e, which overrides every variable,
    # not only the ones the tasks above refuse by name. A stray users,
    # foomuuri_* or ssh_client_options would change the build without a
    # word, so the node definition's own fields, the keys of its file in
    # intake/, must each be one platforms.yml lists. Extra variables given
    # beside it on the command line, such as -e uc_raw_node_adopt=true, are
    # not in the file, and are not checked here.
    - name: Refuse a node definition field the build does not know
      ansible.builtin.assert:
        that:
          - uc_intake_fields is mapping
          - uc_unknown_fields | length == 0
        fail_msg: >-
          {{ uc_intake_file }} sets {{ uc_unknown_fields | join(', ') }}, which
          {{ 'is not a node definition field' if uc_unknown_fields | length == 1 else 'are not node definition fields' }}.
          A node definition is passed with -e, which overrides every variable, so the build refuses
          any field but {{ uc_allowed_fields | join(', ') }}. Remove
          {{ 'it' if uc_unknown_fields | length == 1 else 'them' }}, or write the node definition again with scripts/new-node.
        quiet: true
      vars:
        uc_intake_fields: "{{ lookup('ansible.builtin.file', uc_intake_file) | from_yaml }}"
        uc_allowed_fields: "{{ node_required_fields + node_optional_fields + platforms[platform].required_fields }}"
        uc_unknown_fields: "{{ (uc_intake_fields.keys() | list if uc_intake_fields is mapping else []) | reject('in', uc_allowed_fields) | list }}"

    - name: Check node_address
      ansible.builtin.assert:
        that:
          - node_address is string
          - node_address is ansible.builtin.match('(?:' ~ node_address_pattern ~ ')$')
        fail_msg: "node_address must be an IPv4 or IPv6 address, for example 203.0.113.10. It is {{ node_address }}."
        quiet: true
      when: node_address is defined

    - name: Check node_label
      ansible.builtin.assert:
        that:
          - node_label in node_labels
        fail_msg: "node_label must be one of {{ node_labels | join(', ') }}. It is {{ node_label }}."
        quiet: true

    - name: Check raw_node_batch
      ansible.builtin.assert:
        that:
          - raw_node_batch is string
          - raw_node_batch is ansible.builtin.match(raw_node_batch_pattern)
        fail_msg: "raw_node_batch must be a batch name, raw-YYYY-MM-DD-NN, with the date the batch was made. It is {{ raw_node_batch }}."
        quiet: true

    # Read the batch once here, so a missing or badly protected batch file
    # stops the build before anything is created. Only a boolean is kept,
    # and no_log hides the task's result. ansible-core still prints the
    # lookup's error above the censored result, which is uc_secret's
    # refusal: it says what to fix and never holds the value.
    - name: Read the batch
      block:
        - name: Read both password hashes from the batch, through uc_secret
          ansible.builtin.set_fact:
            uc_batch_hashes_valid: "{{ (lookup('uc_secret', 'batches/' ~ raw_node_batch, key='root_password_hash') is ansible.builtin.match('[$](6|y)[$]')) and (lookup('uc_secret', 'batches/' ~ raw_node_batch, key='initial_password_hash') is ansible.builtin.match('[$](6|y)[$]')) }}"
          no_log: true

      rescue:
        - name: Stop, since the batch could not be read
          ansible.builtin.fail:
            msg: "The batch {{ raw_node_batch }} could not be read through uc_secret, for the reason in the error above. If the batch does not exist yet, make it with scripts/new-batch {{ raw_node_batch }}."

    - name: Check that the batch holds password hashes
      ansible.builtin.assert:
        that:
          - uc_batch_hashes_valid | bool
        fail_msg: "The batch {{ raw_node_batch }} holds root_password_hash and initial_password_hash, but they are not SHA-512 or yescrypt crypt hashes. Retire the batch and make a new one with scripts/new-batch."
        quiet: true

    # Incus allows at most 63 characters in an instance name.
    - name: Check the length of the Incus instance name
      ansible.builtin.assert:
        that:
          - incus_instance | length <= 63
        fail_msg: "The Incus instance name {{ incus_instance }} is {{ incus_instance | length }} characters, and Incus allows at most 63. Use a shorter client_domain."
        quiet: true
      when: platform == 'incus'

# Every platform's plays are imported, whatever the node's platform. A play
# on localhost runs its tasks only when platform names its platform. A play
# on the node targets the platform's own group, such as platform_ssh, which
# only that platform's create play fills. A templated import path would be
# resolved before group_vars are loaded, so the platform default in node.yml
# would not apply.
- name: Create the node on Incus
  ansible.builtin.import_playbook: platforms/incus/create.yml

- name: Connect to the node over SSH
  ansible.builtin.import_playbook: platforms/ssh/create.yml

# On every platform, once the node is in the inventory.
- name: Wait for the node to finish booting
  hosts: raw_node
  gather_facts: false

  tasks:
    - name: Wait for the node to finish booting
      ansible.builtin.import_tasks: tasks/wait-for-boot.yml

- name: Bootstrap
  hosts: raw_node
  gather_facts: false

  roles:
    - role: robertdebock.bootstrap

- name: Prepare the node on the ssh platform
  ansible.builtin.import_playbook: platforms/ssh/prepare.yml

- name: Configure the node to contract
  hosts: raw_node
  gather_facts: true

  roles:
    - role: robertdebock.hostname
    - role: robertdebock.epel
      when: ansible_facts['os_family'] == 'RedHat'
#    - role: robertdebock.software # if additional packaged software is ever required
    - role: robertdebock.users
    - role: steelcj.foomuuri
    - role: robertdebock.openssh

  tasks:
    # robertdebock.hostname sets only the hostname. Debian resolves its own
    # fully qualified domain name from the 127.0.1.1 line in /etc/hosts, so
    # hostname -f returns node_fqdn once that line names it.
    - name: Name the fully qualified domain name in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1\t{{ node_fqdn }} {{ node_hostname }}"
        insertafter: '^127\.0\.0\.1\s'

- name: Switch to the contract connection on the ssh platform
  ansible.builtin.import_playbook: platforms/ssh/switch.yml

- name: Reboot
  hosts: raw_node
  gather_facts: false

  tasks:
    # The build reboots every time, on purpose. ansible.builtin.reboot fails
    # if the boot ID has not changed within reboot_timeout, so a reboot that
    # did not happen is never reported as done.
    - name: Reboot the node
      ansible.builtin.reboot:
        reboot_timeout: 600

    - name: Wait for the node to finish booting again
      ansible.builtin.import_tasks: tasks/wait-for-boot.yml

    # Only systemd's own messages: Ansible logs this task's arguments to the
    # journal too, and they hold the pattern. systemd's early messages reach
    # the journal from the kernel log, without _PID=1, so the filter is on
    # SYSLOG_IDENTIFIER.
    - name: Read ordering cycles from this boot's journal
      ansible.builtin.command:
        argv: [journalctl, -b, SYSLOG_IDENTIFIER=systemd, --no-pager, -o, cat, --grep, "{{ boot_cycle_pattern }}"]
      register: journal_cycles
      changed_when: false
      failed_when: journal_cycles.rc not in [0, 1]

    # In an Incus container, systemd logs an ordering cycle to the console
    # before journald has started, so the journal never has it. The console
    # log holds the boot that just happened.
    - name: Read ordering cycles from the Incus console log
      ansible.builtin.command:
        argv: [incus, console, --show-log, "{{ incus_instance }}"]
      register: console_log
      delegate_to: localhost
      changed_when: false
      when: platform == 'incus'

    - name: Collect the ordering cycle lines
      ansible.builtin.set_fact:
        boot_cycles: "{{ (journal_cycles.stdout_lines + (console_log.stdout_lines | default([]))) | select('search', boot_cycle_pattern, ignorecase=true) | map('trim') | unique | list }}"

    - name: Show the ordering cycles
      ansible.builtin.debug:
        msg: "{{ boot_cycles }}"
      when: boot_cycles | length > 0

    - name: Stop if systemd found an ordering cycle
      ansible.builtin.assert:
        that:
          - boot_cycles | length == 0
        fail_msg: "systemd found an ordering cycle while booting {{ inventory_hostname }}, and skipped a unit to break it. The skipped unit may be the firewall. The task above shows the cycle."
        quiet: true

# The node as admission will find it: the confirmation, measured on the
# node after the reboot, written to /var/lib/raw-node/confirmation.yml, read
# back through the platform and checked.
- name: Confirm the node meets the contract
  hosts: raw_node
  gather_facts: false

  tasks:
    - name: Measure, write, read back and check the confirmation
      ansible.builtin.import_tasks: tasks/confirmation.yml

# uc-node's job ends here, at connected securely: the node meets the
# contract, its confirmation is on the node, and its candidate is in the
# client inventory's candidates/. The tasks run on the node's play, and
# write on the controller host with delegate_to, so a failure here is the
# node's and is recorded as a rejection.
- name: Hand the node over as a candidate
  hosts: raw_node
  gather_facts: false

  tasks:
    # On the ssh platform admission connects where the build did. On Incus,
    # to the address the node reports on its IPv4 default route.
    - name: Note the address admission connects to
      ansible.builtin.set_fact:
        uc_candidate_address: >-
          {{ node_address if platform == 'ssh' else
             (uc_confirmation_reported.interfaces | default([]) | selectattr('default_route4', 'eq', true)
              | map(attribute='ip') | flatten | first | default('')) }}

    - name: Stop if there is no address to hand over
      ansible.builtin.assert:
        that:
          - uc_candidate_address | length > 0
        fail_msg: "The confirmation reports no IPv4 address on a default route, so there is no address for admission to connect to."
        quiet: true

    - name: Read the time the build finished, on the controller host
      ansible.builtin.command:
        argv: [date, "+%Y-%m-%dT%H:%M:%S%:z"]
      register: uc_built
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Make the client inventory's candidates/
      ansible.builtin.file:
        path: "{{ uc_candidates_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Write the candidate
      ansible.builtin.template:
        src: templates/candidate.yml.j2
        dest: "{{ uc_candidate_file }}"
        mode: "0644"
      delegate_to: localhost
      become: false
      vars:
        uc_candidate:
          fqdn: "{{ node_fqdn }}"
          address: "{{ uc_candidate_address }}"
          ssh_port: "{{ ssh_port }}"
          fingerprint: "{{ uc_node_fingerprint }}"
          raw_node_batch: "{{ raw_node_batch }}"
          node_label: "{{ node_label }}"
          platform: "{{ platform }}"
          producer: uc-node
          producer_version: "{{ uc_node_version }}"
          contract: "{{ uc_contract_version }}"
          built: "{{ uc_built.stdout | trim }}"

    - name: Show the node, and what to compare at its console before admission
      ansible.builtin.debug:
        msg:
          - "{{ node_fqdn }} is connected securely. Its candidate is {{ uc_candidate_file }}."
          - "Address: {{ uc_candidate_address }}, SSH port {{ ssh_port }}"
          - "ED25519 host key: {{ uc_node_fingerprint }}"
          - "Before admission, compare this fingerprint with the one the node's console shows:"
          - "{{ ('  incus exec ' ~ incus_instance ~ ' -- ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub') if platform == 'incus' else '  at the provider''s console: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub' }}"
          - "{{ 'The confirmation passed check_raw_confirmation.py.' if uc_confirmation_result is defined else 'WARNING: the confirmation was not checked, since UC_CONTROLLER is not set.' }}"
