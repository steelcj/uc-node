#!/usr/bin/env ansible-playbook
---
- name: Check the node definition
  hosts: localhost
  gather_facts: false

  tasks:
    # Ansible loads inventory/group_vars/ only with this repository's
    # inventory, which ansible.cfg names when run from this directory.
    - name: Check that the repository's configuration is loaded
      ansible.builtin.assert:
        that:
          - platforms is defined
        fail_msg: "The configuration in inventory/group_vars/all/ is not loaded. Run ansible-playbook from the repository directory, so it reads ansible.cfg and uses the repository's inventory."
        quiet: true

    # inventory/group_vars/all/hostname.yml sets hostname from
    # node_hostname, so a different value can only come from a node
    # definition written before client_domain replaced hostname.
    - name: Refuse a node definition that still has hostname
      ansible.builtin.assert:
        that:
          - hostname == node_hostname
        fail_msg: "The node definition sets hostname, which is no longer used. Rename hostname to client_domain in the node definition."
        quiet: true

    - name: Check platform
      ansible.builtin.assert:
        that:
          - platform in platforms
        fail_msg: "platform must be one of {{ platforms.keys() | join(', ') }}. It is {{ platform }}."
        quiet: true

    - name: Check that the required fields are present
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.vars', item, default='') | string | length > 0
        fail_msg: "The node definition has no {{ item }}, which the {{ platform }} platform requires."
        quiet: true
      loop: "{{ node_required_fields + platforms[platform].required_fields }}"

    # These restate the rules in names.yml and incus.yml, so a value that
    # differs can only come from the node definition. Change them together.
    - name: Refuse a node definition that sets a calculated name
      ansible.builtin.assert:
        that:
          - node_fqdn == node_label ~ '.' ~ client_domain
          - node_hostname == node_label
          - incus_instance == (node_label ~ '.' ~ client_domain) | replace('.', '-')
        fail_msg: "The node definition sets node_fqdn, node_hostname or incus_instance. These are calculated from client_domain and node_label, so remove them from the node definition."
        quiet: true

    # The same rule as scripts/new-node: at least two labels, each of 1 to
    # 63 lowercase letters, digits and hyphens, not starting or ending with
    # a hyphen, and at most 253 characters in all.
    - name: Check client_domain
      ansible.builtin.assert:
        that:
          - client_domain is string
          - client_domain | length <= 253
          - client_domain is ansible.builtin.match('^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
        fail_msg: "client_domain must be DNS labels of lowercase letters, digits and hyphens, each at most 63 characters, separated by dots and at most 253 characters in all, for example example.org. It is {{ client_domain }}."
        quiet: true

    - name: Check node_label
      ansible.builtin.assert:
        that:
          - node_label in node_labels
        fail_msg: "node_label must be one of {{ node_labels | join(', ') }}. It is {{ node_label }}."
        quiet: true

    # Incus allows at most 63 characters in an instance name.
    - name: Check the length of the Incus instance name
      ansible.builtin.assert:
        that:
          - incus_instance | length <= 63
        fail_msg: "The Incus instance name {{ incus_instance }} is {{ incus_instance | length }} characters, and Incus allows at most 63. Use a shorter client_domain."
        quiet: true
      when: platform == 'incus'

# Every platform's plays are imported, whatever the node's platform. A play
# on localhost runs its tasks only when platform names its platform. A play
# on the node targets the platform's own group, such as platform_ssh, which
# only that platform's create play fills. A templated import path would be
# resolved before group_vars are loaded, so the platform default in node.yml
# would not apply.
- name: Create the node on Incus
  ansible.builtin.import_playbook: platforms/incus/create.yml

- name: Connect to the node over SSH
  ansible.builtin.import_playbook: platforms/ssh/create.yml

# On every platform, once the node is in the inventory.
- name: Wait for the node to finish booting
  hosts: raw_node
  gather_facts: false

  tasks:
    - name: Wait for the node to finish booting
      ansible.builtin.import_tasks: tasks/wait-for-boot.yml

- name: Bootstrap
  hosts: raw_node
  gather_facts: false

  roles:
    - role: robertdebock.bootstrap

- name: Prepare the node on the ssh platform
  ansible.builtin.import_playbook: platforms/ssh/prepare.yml

- name: Configure the node to contract
  hosts: raw_node
  gather_facts: true

  roles:
    - role: robertdebock.hostname
    - role: robertdebock.epel
      when: ansible_facts['os_family'] == 'RedHat'
#    - role: robertdebock.software # if additional packaged software is ever required
    - role: robertdebock.users
    - role: steelcj.foomuuri
    - role: robertdebock.openssh

  tasks:
    # robertdebock.hostname sets only the hostname. Debian resolves its own
    # fully qualified domain name from the 127.0.1.1 line in /etc/hosts, so
    # hostname -f returns node_fqdn once that line names it.
    - name: Name the fully qualified domain name in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1\t{{ node_fqdn }} {{ node_hostname }}"
        insertafter: '^127\.0\.0\.1\s'

- name: Switch to the contract connection on the ssh platform
  ansible.builtin.import_playbook: platforms/ssh/switch.yml

- name: Reboot
  hosts: raw_node
  gather_facts: false

  tasks:
    # The build reboots every time, on purpose. ansible.builtin.reboot fails
    # if the boot ID has not changed within reboot_timeout, so a reboot that
    # did not happen is never reported as done.
    - name: Reboot the node
      ansible.builtin.reboot:
        reboot_timeout: 600

    - name: Wait for the node to finish booting again
      ansible.builtin.import_tasks: tasks/wait-for-boot.yml

    # Only systemd's own messages: Ansible logs this task's arguments to the
    # journal too, and they hold the pattern. systemd's early messages reach
    # the journal from the kernel log, without _PID=1, so the filter is on
    # SYSLOG_IDENTIFIER.
    - name: Read ordering cycles from this boot's journal
      ansible.builtin.command:
        argv: [journalctl, -b, SYSLOG_IDENTIFIER=systemd, --no-pager, -o, cat, --grep, "{{ boot_cycle_pattern }}"]
      register: journal_cycles
      changed_when: false
      failed_when: journal_cycles.rc not in [0, 1]

    # In an Incus container, systemd logs an ordering cycle to the console
    # before journald has started, so the journal never has it. The console
    # log holds the boot that just happened.
    - name: Read ordering cycles from the Incus console log
      ansible.builtin.command:
        argv: [incus, console, --show-log, "{{ incus_instance }}"]
      register: console_log
      delegate_to: localhost
      changed_when: false
      when: platform == 'incus'

    - name: Collect the ordering cycle lines
      ansible.builtin.set_fact:
        boot_cycles: "{{ (journal_cycles.stdout_lines + (console_log.stdout_lines | default([]))) | select('search', boot_cycle_pattern, ignorecase=true) | map('trim') | unique | list }}"

    - name: Show the ordering cycles
      ansible.builtin.debug:
        msg: "{{ boot_cycles }}"
      when: boot_cycles | length > 0

    - name: Stop if systemd found an ordering cycle
      ansible.builtin.assert:
        that:
          - boot_cycles | length == 0
        fail_msg: "systemd found an ordering cycle while booting {{ inventory_hostname }}, and skipped a unit to break it. The skipped unit may be the firewall. The task above shows the cycle."
        quiet: true
