---
# group_vars/all/platforms.yml
#
# The platforms uc-node can build on, and the node definition fields each
# one requires. Data only: build.yml checks a node definition against it
# before anything is created, and scripts/new-node offers its keys.

# The fields every node definition must set, whatever its platform. They
# have no default.
node_required_fields:
  - client_domain
  - root_password_hash
  - initial_username
  - initial_password_hash
  - ssh_public_key

# One entry per platform, named as in a node definition's platform field,
# with the fields that platform requires on top of node_required_fields.
platforms:
  # A local Incus container, reached with incus exec.
  incus:
    required_fields: []
  # A Debian 13 host reached as root over SSH, such as a VPS.
  ssh:
    required_fields:
      - node_address
