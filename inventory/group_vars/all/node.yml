---
# inventory/group_vars/all/node.yml
#
# Defaults for the node definition.
#
# Every value here is used only when the node definition does not set it.
# The node definition is passed to build.yml with -e @<file>, and values
# passed with -e always override group_vars. For example, a node definition
# with platform: ssh builds on a host reached over SSH, whatever this file
# says.
#
# For the names calculated from client_domain and node_label, see names.yml.

# Where the node runs: one of the platforms in platforms.yml.
platform: incus

# The node's label: one of the labels in labels.yml.
node_label: raw

# The port SSH listens on.
ssh_port: 22

# Addresses or networks allowed to reach SSH. Empty means any. On the ssh
# platform, include the controller's own public address, or the build locks
# itself out.
ssh_sources: []
