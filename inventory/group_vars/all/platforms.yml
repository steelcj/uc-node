---
# inventory/group_vars/all/platforms.yml
#
# The platforms uc-node can build on, and the node definition fields each
# one requires. Data only: build.yml checks a node definition against it
# before anything is created, and scripts/new-node offers its keys.

# The fields every node definition must set, whatever its platform. They
# have no default. The password hashes are not among them: they are in the
# batch that raw_node_batch names, read through uc_secret (users.yml).
node_required_fields:
  - client_domain
  - initial_username
  - ssh_public_key
  - raw_node_batch

# Connection variables each platform's create play sets with add_host. A
# node definition is passed with -e, which would override them, so the
# check play refuses a node definition that sets one. ansible_become_password
# is not in the list: it may be given with -e instead of --ask-become-pass.
node_connection_variables:
  - ansible_host
  - ansible_user
  - ansible_port
  - ansible_ssh_common_args
  - ansible_ssh_host_key_checking

# One entry per platform, named as in a node definition's platform field,
# with the fields that platform requires on top of node_required_fields.
platforms:
  # A local Incus container, reached with incus exec.
  incus:
    required_fields: []
  # A Debian 13 host reached as root over SSH, such as a VPS.
  ssh:
    required_fields:
      - node_address
